site_name: Concordia Documentation
site_description: A comprehensive guide to Concordia - a library for generative social simulation
site_author: Google DeepMind
site_url: https://google-deepmind.github.io/concordia/

repo_name: google-deepmind/concordia
repo_url: https://github.com/google-deepmind/concordia
edit_uri: edit/main/docs/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - What is Concordia?: getting-started/what-is-concordia.md
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
  - Core Concepts:
    - Understanding the Framework: core-concepts/framework-overview.md
    - Agents and Components: core-concepts/agents-and-components.md
    - The Game Master Pattern: core-concepts/game-master.md
  - Tutorials:
    - Basic Usage:
      - Your First Simulation: tutorials/basic/creating-simulation.md
      - Building an Agent: tutorials/basic/assembling-agent.md
      - Creating Custom Components: tutorials/basic/create-prefab.md
    - Advanced Techniques:
      - Digital Twin Development: tutorials/advanced/digital-twins.md
      - Advanced Digital Twins: tutorials/advanced/advanced-digital-twins.md
      - Data Generation: tutorials/advanced/data-generation.md
      - Moral Maze Experiments: tutorials/advanced/moral-mazes.md
  - Examples:
    - Jupyter Notebooks: examples/notebooks.md
    - Sample Implementations: examples/implementations.md
  - API Reference:
    - Core Modules: api/core.md
    - Components: api/components.md
    - Prefabs: api/prefabs.md
  - Community:
    - Contributing: community/contributing.md
    - Support: community/support.md
